# if the source stops updating for >2–4 hours, you get notified immediately
# Data must be available and ready to consume as soon as possible
# the freshness time frame is adjustable as per sue case

version: 2
sources:
  - name: customer_orders
    database: finance_db
    schema: operations
    tables:
      - name: products
        loaded_at_field: updated_at
        freshness:
          warn_after: { count: 2, period: hour }
          error_after: { count: 4, period: hour }
        columns:
          - name: product_id
          - name: product_name
          - name: barcode
          - name: unity_price
          - name: is_active
          - name: updated_at
          - name: updated_by
          - name: created_at
          - name: created_by

      - name: customers
        loaded_at_field: updated_at
        freshness:
          warn_after: { count: 2, period: hour }
          error_after: { count: 4, period: hour }
        columns:
          - name: customer_id
          - name: customer_name
          - name: is_active
          - name: customer_address
          - name: updated_at
          - name: updated_by
          - name: created_at
          - name: created_by

      - name: orders
        loaded_at_field: updated_at
        freshness:
          warn_after: { count: 2, period: hour }
          error_after: { count: 4, period: hour }
        columns:
          - name: order_id
          - name: order_date
          - name: delivery_date
          - name: customer_id
          - name: status
          - name: updated_at
          - name: updated_by
          - name: created_at
          - name: created_by

      - name: order_items
        loaded_at_field: updated_at
        freshness:
          warn_after: { count: 2, period: hour }
          error_after: { count: 4, period: hour }
        columns:
          - name: order_item_id
          - name: order_id
          - name: product_id
          - name: quantity
          - name: updated_at
          - name: updated_by
          - name: created_at
          - name: created_by